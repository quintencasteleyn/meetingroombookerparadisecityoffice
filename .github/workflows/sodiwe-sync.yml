# Copies full-time employees' days off from Sodiwe into the holiday planner.
# Runs every night; "Run workflow" syncs right away. Until the Sodiwe
# certificate is added (README → "Connect Sodiwe") it skips without failing.
# Sodiwe handles requests through a queue, so a run can take a few minutes.
name: Sync Sodiwe absences

on:
  schedule:
    # 04:15 UTC = 05:15 or 06:15 in Brussels, before anyone opens the planner.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would change (write nothing)'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SODIWE_CERT_PFX_BASE64: ${{ secrets.SODIWE_CERT_PFX_BASE64 }}
      SODIWE_CERT_PASSWORD: ${{ secrets.SODIWE_CERT_PASSWORD }}
      SODIWE_BASE_URL: ${{ vars.SODIWE_BASE_URL }}
      SODIWE_EMPLOYER: ${{ vars.SODIWE_EMPLOYER }}
      SODIWE_ABSENCE_CODES: ${{ vars.SODIWE_ABSENCE_CODES }}
      SODIWE_EXCLUDE_CODES: ${{ vars.SODIWE_EXCLUDE_CODES }}
    steps:
      - name: Check the settings
        id: check
        run: |
          if [ -z "$SODIWE_CERT_PFX_BASE64" ]; then
            echo "::notice::Sodiwe is not connected yet (secret SODIWE_CERT_PFX_BASE64 is missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add the variable SUPABASE_URL and the secret SUPABASE_SERVICE_ROLE_KEY (see README)."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Sync
        if: steps.check.outputs.ready == 'true'
        run: node --experimental-strip-types --no-warnings scripts/sodiwe-sync.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
