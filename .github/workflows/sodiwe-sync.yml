# Copies full-time employees' days off from Sodiwe into the holiday planner.
# Runs every night; "Run workflow" lets you test the connection, see what
# would change, or sync right away. Until the Sodiwe certificate is added
# (README → "Connect Sodiwe") it skips without failing.
# Sodiwe handles requests through a queue, so a run can take a few minutes.
# This repository is public, so the log only ever shows counts.
name: Sync Sodiwe absences

on:
  schedule:
    # 04:15 UTC = 05:15 or 06:15 in Brussels, before anyone opens the planner.
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to do'
        type: choice
        default: 'Test the connection only'
        options:
          - 'Test the connection only'
          - 'Show what would change (write nothing)'
          - 'Sync for real'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The nightly run has no input, so it syncs for real.
      MODE: ${{ inputs.mode || 'Sync for real' }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SODIWE_CERT_PFX_BASE64: ${{ secrets.SODIWE_CERT_PFX_BASE64 }}
      SODIWE_CERT_PASSWORD: ${{ secrets.SODIWE_CERT_PASSWORD }}
      SODIWE_BASE_URL: ${{ vars.SODIWE_BASE_URL }}
      SODIWE_EMPLOYER: ${{ vars.SODIWE_EMPLOYER }}
      SODIWE_ABSENCE_CODES: ${{ vars.SODIWE_ABSENCE_CODES }}
      SODIWE_EXCLUDE_CODES: ${{ vars.SODIWE_EXCLUDE_CODES }}
    steps:
      - name: Check the settings
        id: check
        run: |
          case "$MODE" in
            'Test the connection only') echo "flag=--test" >> "$GITHUB_OUTPUT" ;;
            'Show what would change (write nothing)') echo "flag=--dry-run" >> "$GITHUB_OUTPUT" ;;
            *) echo "flag=" >> "$GITHUB_OUTPUT" ;;
          esac
          if [ -z "$SODIWE_CERT_PFX_BASE64" ]; then
            echo "::notice::Sodiwe is not connected yet (secret SODIWE_CERT_PFX_BASE64 is missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" != 'Test the connection only' ] && { [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; }; then
            echo "::error::Add the variable SUPABASE_URL and the secret SUPABASE_SERVICE_ROLE_KEY (see README)."
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - name: Run
        if: steps.check.outputs.ready == 'true'
        # --openssl-legacy-provider: Sodiwe's certificate uses an older encryption.
        run: node --openssl-legacy-provider --experimental-strip-types --no-warnings scripts/sodiwe-sync.mjs ${{ steps.check.outputs.flag }}
