# Deploys the Supabase Edge Functions (emails + admin user management).
# Needs secret SUPABASE_ACCESS_TOKEN and variable SUPABASE_PROJECT_REF (see README).
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        run: |
          for fn in notify admin-users auth-email; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
