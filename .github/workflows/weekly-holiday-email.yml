# Sends the weekly "who's off next week" email to the whole company.
# Runs every Friday afternoon (Brussels time); "Run workflow" sends it
# right away (it is only sent once per week, so running it twice is safe).
# Needs secret CRON_SECRET (also set in Supabase) and variable SUPABASE_URL.
name: Weekly holiday email

on:
  schedule:
    # GitHub uses UTC: 13:00 UTC = 15:00 in summer, 14:00 in winter.
    - cron: '0 13 * * 5'
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send the weekly email
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SUPABASE_URL" ]; then
            echo "::error::Add the secret CRON_SECRET and the variable SUPABASE_URL first (see README, holiday planner setup)."
            exit 1
          fi
          response=$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/functions/v1/holiday-digest" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"action":"scheduled"}')
          echo "$response"
