# Sends the weekly "who's off next week" email to the whole company.
# "Run workflow" sends it right away (it is only sent once per week, so
# running it twice is safe).
# Needs secret CRON_SECRET (also set in Supabase) and variable SUPABASE_URL.
#
# The Friday schedule is OFF until the company gets the go-ahead. To switch
# it on, add this under "on:" (GitHub uses UTC: 13:00 UTC = 15:00 Brussels
# time in summer, 14:00 in winter):
#
#   schedule:
#     - cron: '0 13 * * 5'
name: Weekly holiday email

on:
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send the weekly email
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice::The weekly email isn't set up yet (secret CRON_SECRET is missing, see README step 9). Skipping."
            exit 0
          fi
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Add the variable SUPABASE_URL (see README)."
            exit 1
          fi
          response=$(curl -sS --fail-with-body -X POST "$SUPABASE_URL/functions/v1/holiday-digest" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{"action":"scheduled"}')
          echo "$response"
